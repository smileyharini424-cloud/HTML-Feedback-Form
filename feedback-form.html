<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
</head>
<body>

    <h1>Feedback Form</h1>

    <form>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name">

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <br><br>

        <label>Rating:</label>
        <br>

        <input type="radio" id="excellent" name="rating" value="Excellent">
        <label for="excellent">Excellent</label>

        <br>

        <input type="radio" id="good" name="rating" value="Good">
        <label for="good">Good</label>

        <br>

        <input type="radio" id="average" name="rating" value="Average">
        <label for="average">Average</label>

        <br>

        <input type="radio" id="poor" name="rating" value="Poor">
        <label for="poor">Poor</label>

        <br><br>

        <label for="comments">Comments:</label>
        <br>
        <textarea id="comments" name="comments" rows="5" cols="40"></textarea>

        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
